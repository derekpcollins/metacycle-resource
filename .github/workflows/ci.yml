name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets the link checker start CI on its dead-links branch (its pushes don't trigger runs).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so pull requests can diff against their base (small repo).
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Format check
        run: npm run format:check
      - name: Issue forms match the content (part dropdowns are generated)
        run: npm run forms:check
      - name: Type check (includes schema validation)
        run: npm run check
      - name: Build (fails on broken cross-references)
        run: npm run build
      # Before test:validation, which leaves dist/ from a deliberately failed build.
      - name: Install Chromium for the accessibility check
        run: npx playwright install --with-deps chromium
      - name: Accessibility (axe, WCAG 2.1 AA, 375px + 1280px, light + dark)
        run: npm run test:a11y
      - name: Content-validation tests (bad files must be rejected)
        run: npm run test:validation
      - name: Web-form validation and issue formatting tests
        run: npm run test:contribution
      - name: Link-check tests (classification and staleness rules)
        run: npm run test:links
      # docs/SPEC.md → "On every PR": check only URLs the pull request adds or changes in
      # content files. Results go to the job summary. Fails only on clearly dead links
      # (HTTP 404/410 or a missing domain); blocked stores and timeouts never fail it.
      - name: Link check on changed content
        if: github.event_name == 'pull_request'
        run: npm run links:check -- --changed-since "${{ github.event.pull_request.base.sha }}" --summary
