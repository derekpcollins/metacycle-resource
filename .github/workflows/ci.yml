name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Format check
        run: npm run format:check
      - name: Issue forms match the content (part dropdowns are generated)
        run: npm run forms:check
      - name: Type check (includes schema validation)
        run: npm run check
      - name: Build (fails on broken cross-references)
        run: npm run build
      - name: Content-validation tests (bad files must be rejected)
        run: npm run test:validation
      - name: Web-form validation and issue formatting tests
        run: npm run test:contribution
