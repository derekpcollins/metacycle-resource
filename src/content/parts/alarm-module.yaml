fits_notes: >-
  Extremely troublesome and a frequent cause of no-power problems; a former Sondors engineer
  called the security system the bike's worst component. A new module comes with two fobs.
  Replacements sometimes arrive with a different plug, so keep the old unit: you may need
  to splice the new wires onto the old plug. Wire colours: alarm red = harness red/white;
  alarm orange = harness yellow; alarm pink = harness blue/white.
