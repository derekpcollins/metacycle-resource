# Phase 3 seed from Metacyclopedia and the research brief. Prices, links and dates need a human check.
id: battery-activator
name: Battery activator (activation dongle)
system: battery-charging
aliases:
  - activation dongle
  - battery marriage dongle
  - dongle
  - battery key
specs:
  power: Two 12 V A23 batteries in parallel
fits_notes: >-
  After reconnecting the battery, it flips an internal relay so the battery can power the
  bike; you'll hear a click. Lost it? Plugging in the charger does the same thing. It feeds
  12 V to pin 3 of the charging port; Metacyclopedia gives the ground pin as pin 5 on one
  page and pin 6 on another, so check before building one. No seller is known.
references:
