specs:
  input_vac: 120/240
  power_w: 1800
  output_vdc: 84
  output_a: 18
  full_charge_time: About 5 hours
  plugs_included: NEMA 5-15 (US) and Type C (EU)
  port_connector: Chogori
fits_notes: >-
  Blinking red-red-green means a communication error, but it still charges; one owner traced
  it to an unsoldered wire in the connector. Plugging in the charger also "activates" a reconnected
  battery like the activation dongle. Because it accepts 240 V, owners use public J1772 chargers
  with a J1772-to-NEMA 5-15/5-20 adapter.
