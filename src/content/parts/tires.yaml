fits_notes: >-
  Bikes shipped with different tires. If your spokes go to tabs on the rim, you have tubeless
  tires. Set the display's wheel circumference to 1675 mm for an accurate speedometer. Tire-change
  videos: youtube.com/watch?v=Q7U2baauyt8 (short) and youtube.com/watch?v=VoAgnKyHUw4 (long).
  No buy links yet: any tire in these sizes should fit, but nobody has confirmed specific
  models — contributions welcome.
